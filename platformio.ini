; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = waveshare_rp2040_zero

[common]
build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    ; Change to LVL_ERROR for production (saves 3-5KB flash)
    ; Change to LVL_TRACE for debugging
    -DDEBUGLOG_DEFAULT_LOG_LEVEL_DEBUG
lib_deps =
    iskakfatoni/IskakINO_LiquidCrystal_I2C @ ^1.0.1
	hideakitai/DebugLog @ ^0.8.4
    bblanchon/ArduinoJson @ ^7.4.3
	makuna/NeoPixelBus @ ^2.8.4
	lennarthennigs/Button2 @ ^2.5.0

[env:waveshare_rp2040_zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
upload_protocol = picotool
upload_flags =
    -f
lib_deps = 
    ${common.lib_deps}
monitor_speed = 115200
build_flags = 
	${common.build_flags}
    -DINFO_DATA_PIN=PIN_NEOPIXEL
	-DINFO_LED_ORDER=Grb
board_build.filesystem_size = 512k
